name = "colher-d-pau-admin-api"
main = "worker.js"
compatibility_date = "2026-09-09"
keep_vars = true

# Secrets a definir no Cloudflare Worker:
# GITHUB_TOKEN                -> token GitHub com Contents: Read and write apenas neste repositorio
# GITHUB_OAUTH_CLIENT_ID      -> Client ID da GitHub OAuth App
# GITHUB_OAUTH_CLIENT_SECRET  -> Client Secret da GitHub OAuth App
# SESSION_SECRET              -> segredo longo e aleatorio para assinar sessoes
# GITHUB_ALLOWED_USERS        -> utilizadores GitHub autorizados, separados por virgulas (ex.: KcidadePT)
#
# Variavel publica recomendada:
# ALLOWED_ORIGIN -> https://kcidadept.github.io
