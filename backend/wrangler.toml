name = "colher-d-pau-admin-api"
main = "worker.js"
compatibility_date = "2026-09-09"
keep_vars = true

# Secrets / variaveis a definir no Cloudflare Worker:
# GITHUB_TOKEN          -> token GitHub com Contents: Read and write apenas neste repositorio
# GOOGLE_CLIENT_ID      -> Client ID da aplicacao OAuth 2.0 no Google Cloud
# GOOGLE_CLIENT_SECRET  -> Client Secret da aplicacao OAuth 2.0 no Google Cloud
# GOOGLE_ALLOWED_EMAILS -> emails Google autorizados, separados por virgulas
# SESSION_SECRET        -> segredo longo e aleatorio para assinar sessoes
#
# Variavel publica recomendada:
# ALLOWED_ORIGIN -> https://kcidadept.github.io
