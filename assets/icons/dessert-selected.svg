<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="title desc">
  <title id="title">Sobremesa</title>
  <desc id="desc">Ícone de sobremesa empratada com cobertura, frutos vermelhos e folha decorativa.</desc>
  <rect width="320" height="240" rx="24" fill="#f5eee4"/>
  <circle cx="160" cy="120" r="78" fill="#fffaf4" stroke="#d9c7ab" stroke-width="2"/>

  <g fill="none" stroke="#9a7440" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- prato -->
    <ellipse cx="160" cy="174" rx="64" ry="14"/>
    <path d="M111 173c13 9 30 13 49 13s36-4 49-13" opacity=".7"/>

    <!-- corpo da sobremesa -->
    <path d="M116 148c0-29 18-49 44-49s44 20 44 49c0 17-13 27-44 27s-44-10-44-27Z"/>
    <path d="M121 126c9-12 22-18 39-18s31 6 39 18"/>

    <!-- cobertura -->
    <path d="M122 132c8 0 10 11 16 11 7 0 8-14 15-14s9 17 16 17c7 0 9-14 15-14s8 10 14 10"/>

    <!-- brilho / volume -->
    <path d="M132 151c2 8 10 13 24 15" opacity=".55"/>

    <!-- folha decorativa -->
    <path d="M164 101c8-15 20-23 34-21-3 14-13 23-29 27Z"/>
    <path d="M171 101c8-8 16-13 25-16" opacity=".75"/>

    <!-- haste -->
    <path d="M160 103c1-14 7-25 18-32"/>

    <!-- frutos vermelhos -->
    <circle cx="151" cy="96" r="8"/>
    <circle cx="165" cy="91" r="8"/>
    <circle cx="178" cy="98" r="8"/>
  </g>

  <g fill="#9a7440">
    <circle cx="151" cy="96" r="2.4"/>
    <circle cx="165" cy="91" r="2.4"/>
    <circle cx="178" cy="98" r="2.4"/>
  </g>
</svg>
