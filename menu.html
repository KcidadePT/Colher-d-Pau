<script>
(function(){
 const btn=document.getElementById('scrollTopBtn');
 if(!btn)return;
 const update=()=>btn.classList.toggle('is-visible',window.scrollY>320);
 window.addEventListener('scroll',update,{passive:true});update();
 btn.addEventListener('click',()=>window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'}));
})();

(function(){
 document.addEventListener('click',event=>{
   const link=event.target.closest('.menu-language-flags a[data-lang]');
   if(!link)return;
   event.preventDefault();
   const currentView=document.body.dataset.menuView==='beverages'?'beverages':'food';
   const currentFamily=document.body.dataset.drinkFamily||'';
   const target=new URL(link.href,location.href);
   target.searchParams.set('view',currentView);
   if(currentView==='beverages'&&currentFamily)target.searchParams.set('family',currentFamily);
   location.href=target.pathname+target.search+target.hash;
 });
})();
</script>
